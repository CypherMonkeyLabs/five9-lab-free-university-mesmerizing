892.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">Private addresses are</text><text x="892.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">translated.</text><text x="892.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">VPN</text></g><line class="flow-line" x1="980" y1="122" x2="1000" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box5"><rect x="1000" y="58" width="176" height="128" rx="12"/></clipPath><rect x="1000" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box5)"><text x="1088.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">RTP</text><text x="1088.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">SIP and RTP are both</text><text x="1088.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">allowed between the</text><text x="1088.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Admin</text></g></svg>