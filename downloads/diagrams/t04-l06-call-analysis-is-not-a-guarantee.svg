<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208 230" role="img" aria-label="A machine and a person"><style>.flow-line{stroke-dasharray:8 6;animation:dash 2.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-56}}@media (prefers-reduced-motion:reduce){.flow-line{animation:none}}</style><rect width="100%" height="100%" fill="#041018"/><text x="20" y="32" fill="#f8fafc" font-size="16" font-family="Segoe UI,sans-serif">A machine and a person</text><clipPath id="box0"><rect x="20" y="58" width="176" height="128" rx="12"/></clipPath><rect x="20" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box0)"><text x="108.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Place</text><text x="108.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">The outbound call is</text><text x="108.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">analyzed.</text><text x="108.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Dialer</text></g><line class="flow-line" x1="196" y1="122" x2="216" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box1"><rect x="216" y="58" width="176" height="128" rx="12"/></clipPath><rect x="216" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box1)"><text x="304.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Live</text><text x="304.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">A live detection can</text><text x="304.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">connect an agent.</text><text x="304.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Detect</text></g><line class="flow-line" x1="392" y1="122" x2="412" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box2"><rect x="412" y="58" width="176" height="128" rx="12"/></clipPath><rect x="412" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box2)"><text x="500.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Machine</text><text x="500.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">A machine detection can</text><text x="500.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">take the voicemail path.</text><text x="500.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Detect</text></g><line class="flow-line" x1="588" y1="122" x2="608" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box3"><rect x="608" y="58" width="176" height="128" rx="12"/></clipPath><rect x="608" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box3)"><text x="696.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Miss</text><text x="696.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">A wrong machine label</text><text x="696.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">means no agent.</text><text x="696.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Agent</text></g><line class="flow-line" x1="784" y1="122" x2="804" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box4"><rect x="804" y="58" width="176" height="128" rx="12"/></clipPath><rect x="804" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box4)"><text x="892.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Level</text><text x="892.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">Voice detection level is</text><text x="892.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">the documented knob.</text><text x="892.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Admin</text></g><line class="flow-line" x1="980" y1="122" x2="1000" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box5"><rect x="1000" y="58" width="176" height="128" rx="12"/></clipPath><rect x="1000" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box5)"><text x="1088.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Report</text><text x="1088.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">Listen to samples before</text><text x="1088.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">you trust the week.</text><text x="1088.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Admin</text></g></svg>