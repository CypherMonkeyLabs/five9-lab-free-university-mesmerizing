<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208 230" role="img" aria-label="A page embeds the IVR"><style>.flow-line{stroke-dasharray:8 6;animation:dash 2.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-56}}@media (prefers-reduced-motion:reduce){.flow-line{animation:none}}</style><rect width="100%" height="100%" fill="#041018"/><text x="20" y="32" fill="#f8fafc" font-size="16" font-family="Segoe UI,sans-serif">A page embeds the IVR</text><clipPath id="box0"><rect x="20" y="58" width="176" height="128" rx="12"/></clipPath><rect x="20" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box0)"><text x="108.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Load</text><text x="108.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">Someone iframes the</text><text x="108.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">visual script.</text><text x="108.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Browser</text></g><line class="flow-line" x1="196" y1="122" x2="216" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box1"><rect x="216" y="58" width="176" height="128" rx="12"/></clipPath><rect x="216" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box1)"><text x="304.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Header</text><text x="304.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">X-Frame-Options can</text><text x="304.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">refuse the frame.</text><text x="304.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Five9</text></g><line class="flow-line"