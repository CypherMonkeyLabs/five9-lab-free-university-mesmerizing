<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208 230" role="img" aria-label="A reminder call"><style>.flow-line{stroke-dasharray:8 6;animation:dash 2.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-56}}@media (prefers-reduced-motion:reduce){.flow-line{animation:none}}</style><rect width="100%" height="100%" fill="#041018"/><text x="20" y="32" fill="#f8fafc" font-size="16" font-family="Segoe UI,sans-serif">A reminder call</text><clipPath id="box0"><rect x="20" y="58" width="176" height="128" rx="12"/></clipPath><rect x="20" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box0)"><text x="108.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">List</text><text x="108.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">The next reminder row is</text><text x="108.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">dialed.</text><text x="108.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Dialer</text></g><line class="flow-line" x1="196" y1="122" x2="216" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box1"><rect x="216" y="58" width="176" height="128" rx="12"/></clipPath><rect x="216" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box1)"><text x="304.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Run</text><text x="304.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">The autodial campaign is</text><text x="304.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">running.</text><text x="304.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Dialer</text></g><line class="flow-line" x1="392" y1="122" x2="412" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box2"><rect x="412" y="58" width="176" height="128" rx="12"/></clipPath><rect x="412" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box2)"><text x="500.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Play</text><text x="500.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">The prompt speaks the</text><text x="500.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">reminder.</text><text x="500.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">IVR</text></g><line class="flow-line" x1="588" y1="122" x2="608" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box3"><rect x="608" y="58" width="176" height="128" rx="12"/></clipPath><rect x="608" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box3)"><text x="696.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Digit</text><text x="696.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">A menu can offer an</text><text x="696.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">agent.</text><text x="696.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Person</text></g><line class="flow-line" x1="784" y1="122" x2="804" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box4"><rect x="804" y="58" width="176" height="128" rx="12"/></clipPath><rect x="804" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box4)"><text x="892.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Skill</text><text x="892.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">Skill Transfer uses the</text><text x="892.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">Outbound Skills list.</text><text x="892.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">IVR</text></g><line class="flow-line" x1="980" y1="122" x2="1000" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box5"><rect x="1000" y="58" width="176" height="128" rx="12"/></clipPath><rect x="1000" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box5)"><text x="1088.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Done</text><text x="1088.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">A final disposition or</text><text x="1088.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">the script ends the row.</text><text x="1088.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Person</text></g></svg>