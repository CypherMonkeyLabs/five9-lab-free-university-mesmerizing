<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1208 230" role="img" aria-label="Dial stays grey"><style>.flow-line{stroke-dasharray:8 6;animation:dash 2.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-56}}@media (prefers-reduced-motion:reduce){.flow-line{animation:none}}</style><rect width="100%" height="100%" fill="#041018"/><text x="20" y="32" fill="#f8fafc" font-size="16" font-family="Segoe UI,sans-serif">Dial stays grey</text><clipPath id="box0"><rect x="20" y="58" width="176" height="128" rx="12"/></clipPath><rect x="20" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box0)"><text x="108.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Only</text><text x="108.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">No other mode is on.</text><text x="108.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Mode</text></g><line class="flow-line" x1="196" y1="122" x2="216" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box1"><rect x="216" y="58" width="176" height="128" rx="12"/></clipPath><rect x="216" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box1)"><text x="304.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Type</text><text x="304.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">The agent types. Paste</text><text x="304.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">is refused.</text><text x="304.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Hands</text></g><line class="flow-line" x1="392" y1="122" x2="412" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box2"><rect x="412" y="58" width="176" height="128" rx="12"/></clipPath><rect x="412" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box2)"><text x="500.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Match</text><text x="500.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">Dial enables when the</text><text x="500.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">digits match.</text><text x="500.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Hands</text></g><line class="flow-line" x1="588" y1="122" x2="608" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box3"><rect x="608" y="58" width="176" height="128" rx="12"/></clipPath><rect x="608" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box3)"><text x="696.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">NR</text><text x="696.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">A preview timeout sets</text><text x="696.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">Not Ready.</text><text x="696.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Timeout</text></g><line class="flow-line" x1="784" y1="122" x2="804" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box4"><rect x="804" y="58" width="176" height="128" rx="12"/></clipPath><rect x="804" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box4)"><text x="892.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">No</text><text x="892.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">Nothing dials itself.</text><text x="892.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Timeout</text></g><line class="flow-line" x1="980" y1="122" x2="1000" y2="122" stroke="#f472b6" stroke-width="3"/><clipPath id="box5"><rect x="1000" y="58" width="176" height="128" rx="12"/></clipPath><rect x="1000" y="58" width="176" height="128" rx="12" fill="#102033" stroke="#67e8f9"/><g clip-path="url(#box5)"><text x="1088.0" y="86" text-anchor="middle" fill="#e7eef8" font-size="14" font-family="Segoe UI,sans-serif">Skip</text><text x="1088.0" y="110" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">Skipping requires the</text><text x="1088.0" y="126" text-anchor="middle" fill="#b6f3ff" font-size="12" font-family="Segoe UI,sans-serif">named permission.</text><text x="1088.0" y="164" text-anchor="middle" fill="#f9a8d4" font-size="11" font-family="Segoe UI,sans-serif">Admin</text></g></svg>