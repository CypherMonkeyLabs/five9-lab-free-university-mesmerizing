<!DOCTYPE html>
<html lang="en" data-theme="signal" data-motion="full" data-font="16">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Five9 Lab</title>
  <meta name="description" content="Independent study lab for Five9 Virtual Contact Center: campaigns, dialer modes, IVR, skills, Agent Desktop Plus, WEM, IVA, CRM, SIP, APIs, and Cisco migration.">
  <link rel="stylesheet" href="css/app.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='8' width='32' height='32' fill='%2307111c'/%3E%3Cpath d='M8 20c4-8 12-8 16 0' stroke='%233ee0ff' fill='none' stroke-width='2'/%3E%3Ccircle cx='16' cy='14' r='2' fill='%23f5b942'/%3E%3C/svg%3E">
  <script>
    try {
      var saved = JSON.parse(localStorage.getItem("f9lab-settings") || "{}");
      if (saved.theme) document.documentElement.dataset.theme = saved.theme;
      if (saved.font) document.documentElement.dataset.font = String(saved.font);
      if (saved.reduced === true) document.documentElement.dataset.motion = "reduce";
      if (saved.reduced === false) document.documentElement.dataset.motion = "full";
      if (saved.reduced == null && matchMedia("(prefers-reduced-motion: reduce)").matches) {
        document.documentElement.dataset.motion = "reduce";
      }
    } catch (err) { /* keep defaults */ }
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js"
    }
  }
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/">
      <svg class="mark" viewBox="0 0 36 36" aria-hidden="true">
        <rect width="36" height="36" rx="10" fill="currentColor" opacity="0.12"></rect>
        <path d="M7 24c5-10 17-10 22 0" fill="none" stroke="var(--cc-accent-1)" stroke-width="2"></path>
        <circle cx="18" cy="16" r="2.4" fill="var(--cc-accent-2)"></circle>
      </svg>
      <span>
        <span class="brand-name">Five9 Lab</span>
        <span class="brand-sub">Signal Floor</span>
      </span>
    </a>
    <div class="top-actions">
      <button type="button" class="btn ghost hide-sm" id="sound-toggle" aria-pressed="false">Sound off</button>
      <button type="button" class="btn" id="open-settings">Settings</button>
    </div>
  </header>
  <div class="shell">
    <nav class="rail" id="rail" aria-label="Lab sections"></nav>
    <main id="main">
      <h1 id="view-title">Five9 Lab</h1>
      <p id="lede" class="lede">Run the floor. Build an IVR, pace a dialer, and break a SIP path on purpose.</p>
      <div id="view" aria-live="polite">
        <p class="note">Opening the floor…</p>
      </div>
    </main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Mobile">
    <a href="#/" data-tab="home">Home</a>
    <a href="#/tracks" data-tab="tracks">Tracks</a>
    <a href="#/tools" data-tab="tools">Tools</a>
    <a href="#/progress" data-tab="progress">Progress</a>
    <button type="button" id="tab-settings">Settings</button>
  </nav>
  <dialog id="settings" aria-labelledby="settings-title">
    <h2 id="settings-title">Floor settings</h2>
    <p class="note">Saved in this browser only.</p>
    <div class="field">
      <span class="lbl" id="theme-label">Theme</span>
      <div class="swatches" role="group" aria-labelledby="theme-label">
        <button type="button" class="swatch" data-theme-pick="signal" style="background:#07111c" aria-label="Signal night"></button>
        <button type="button" class="swatch" data-theme-pick="paper" style="background:#f3f6fb" aria-label="Paper floor"></button>
        <button type="button" class="swatch" data-theme-pick="contrast" style="background:#000;border-color:#ffe600" aria-label="High contrast"></button>
        <button type="button" class="swatch" data-theme-pick="amber" style="background:#1a1208" aria-label="Amber ops"></button>
        <button type="button" class="swatch" data-theme-pick="aurora" style="background:#f6f3ff" aria-label="Aurora"></button>
      </div>
    </div>
    <label class="choice"><input type="checkbox" id="set-sound"> Sound effects</label>
    <label class="choice"><input type="checkbox" id="set-narration"> Narration</label>
    <div class="field">
      <label for="set-voice">Voice</label>
      <select id="set-voice"></select>
      <p class="note" id="voice-note">Waiting for the speech voices list.</p>
    </div>
    <div class="field">
      <label for="set-rate">Narration speed <output id="rate-out">1.0</output></label>
      <input id="set-rate" type="range" min="0.7" max="1.3" step="0.05" value="1">
    </div>
    <label class="choice"><input type="checkbox" id="set-motion"> Reduced motion</label>
    <div class="field">
      <label for="set-font">Text size</label>
      <select id="set-font">
        <option value="16">Default</option>
        <option value="18">Large</option>
        <option value="20">Larger</option>
        <option value="22">Maximum</option>
      </select>
    </div>
    <div class="row">
      <button type="button" class="btn primary" id="settings-close">Close</button>
      <button type="button" class="btn ghost" id="narrate-sample">Play sample</button>
    </div>
  </dialog>
  <script type="module" src="js/app.js"></script>
</body>
</html>
